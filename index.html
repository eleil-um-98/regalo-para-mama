<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un regalo para ti 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- PANTALLA INICIAL -->
    <!-- ========================= -->

    <main class="pantalla-inicial" id="pantallaInicial">

        <div class="contenido">

            <div class="sobre">💌</div>

            <h1>Tengo algo para ti...</h1>

            <p>
                Hay un pequeño regalo esperando ser descubierto.
            </p>

            <button id="botonRegalo">
                🎁 Recibir tu regalo
            </button>

        </div>

    </main>


    <!-- ========================= -->
    <!-- ESCENA DE LA FLOR -->
    <!-- ========================= -->

    <main class="escena" id="escena">

        <div class="flor">

            <!-- PÉTALOS -->
            <div class="petalos">

                <span class="petalo p1"></span>
                <span class="petalo p2"></span>
                <span class="petalo p3"></span>
                <span class="petalo p4"></span>
                <span class="petalo p5"></span>
                <span class="petalo p6"></span>
                <span class="petalo p7"></span>
                <span class="petalo p8"></span>
                <span class="petalo p9"></span>
                <span class="petalo p10"></span>
                <span class="petalo p11"></span>
                <span class="petalo p12"></span>

            </div>


            <!-- CENTRO -->
            <div class="centro">

                <div class="semillas"></div>

            </div>


            <!-- TALLO -->
            <div class="tallo"></div>


            <!-- HOJAS -->
            <div class="hoja hoja-izquierda">

                <span class="nervadura"></span>

            </div>


            <div class="hoja hoja-derecha">

                <span class="nervadura"></span>

            </div>

        </div>


        <!-- ========================= -->
        <!-- MENSAJE -->
        <!-- ========================= -->

        <div class="mensaje">

            <h2>🌻 Para ti 💛</h2>

            <p>
                Para la persona que llena mi vida de amor, paciencia y ternura.
                Esta flor es pequeña comparada con todo lo que te mereces, mamá. 🌻💛
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
